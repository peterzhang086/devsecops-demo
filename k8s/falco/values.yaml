driver:
  kind: modern_ebpf  # no kernel module needed; works on EKS AL2023 (kernel 6.x)

falco:
  json_output: true
  json_include_output_property: true
  log_stderr: true
  log_syslog: false
  priority: notice
  stdout_output:
    enabled: true

  customRules:
    crypto-api-rules.yaml: |-
      # Detect shell execution inside crypto-api pods
      # Demo: run `kubectl exec -it <pod> -n crypto-api -- sh` to trigger
      - rule: Crypto API Shell Spawned
        desc: A shell was spawned inside a crypto-asset-api pod — likely an attacker or accidental exec
        condition: >
          spawned_process and container and
          k8s.ns.name = "crypto-api" and
          proc.name in (shell_binaries)
        output: >
          SECURITY ALERT - Shell spawned in crypto-api pod
          (user=%user.name uid=%user.uid pod=%k8s.pod.name
           container=%container.name shell=%proc.name
           parent=%proc.pname cmdline=%proc.cmdline
           image=%container.image.repository)
        priority: CRITICAL
        source: syscall
        tags: [crypto-api, shell, mitre_execution, T1059]

      # Detect any unexpected process (server binary is the only expected one)
      - rule: Crypto API Unexpected Process
        desc: An unexpected process started in crypto-api — server binary is the only expected process
        condition: >
          spawned_process and container and
          k8s.ns.name = "crypto-api" and
          not proc.name in (server)
        output: >
          Unexpected process in crypto-api pod
          (user=%user.name pod=%k8s.pod.name
           container=%container.name proc=%proc.name
           parent=%proc.pname cmdline=%proc.cmdline
           image=%container.image.repository)
        priority: WARNING
        source: syscall
        tags: [crypto-api, process, mitre_execution]

falcosidekick:
  enabled: false
