apiVersion: v1
kind: Service
metadata:
  name: crypto-asset-api
  namespace: crypto-api
spec:
  type: ClusterIP
  selector:
    app: crypto-asset-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
# Default-deny NetworkPolicy — explicit allow-listing only.
# This single object catches a huge class of lateral-movement risks.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: crypto-api
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-alb
  namespace: crypto-api
spec:
  podSelector:
    matchLabels:
      app: crypto-asset-api
  policyTypes: [Ingress]
  ingress:
    - from:
        # ALB controller pods live in kube-system in default install
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: crypto-api
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
