apiVersion: apps/v1
kind: Deployment
metadata:
  name: crypto-asset-api
  namespace: crypto-api
  labels:
    app: crypto-asset-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crypto-asset-api
  template:
    metadata:
      labels:
        app: crypto-asset-api
    spec:
      serviceAccountName: crypto-asset-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532       # distroless nonroot
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: REPLACE_IN_OVERLAY  # kustomize patches this
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crypto-asset-api
  namespace: crypto-api
automountServiceAccountToken: false
